<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5C4A3A" />
    <meta name="description" content="Хосуудад зориулсан өдөр тутмын хамтын төлөвлөгөө — ус, жагсаалт, дэлгэцийн цаг, GIF" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ankomeow" />
    <title>Төвлөрөх Хамтрах</title>

    <!-- Splash-д хэрэгтэй эхний зургуудыг JS bundle-тай зэрэг татаж эхэлнэ,
         ингэснээр React mount болмогц зураг аль хэдийн бэлэн байна. -->
    <link rel="preload" as="image" href="./img/load-0.webp" />
    <link rel="preload" as="image" href="./img/bg-main.webp" />

    <!-- Firestore/Auth-ын холболтыг эрт эхлүүлж, гар барилцах хугацааг нуух -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />

    <!-- JS татагдаж дуустал цагаан дэлгэц харагдахгүй -->
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #F4EADA; }
    </style>
    <!-- React ачаалахаас ӨМНӨ дэвсгэрийг тааруулна: шөнийн горимд цайвар
         дэлгэц анивчихаас сэргийлнэ. Бүтэн палитрыг энд давхардуулахгүй —
         зөвхөн эхний будалтад хэрэгтэй хоёр утга. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("ankomeow-theme") || "auto";
          var dark = m === "dark" || (m === "auto" &&
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var bg = dark ? "#191419" : "#F4EADA";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var st = document.createElement("style");
          st.textContent = "body{background:" + bg + "}";
          document.head.appendChild(st);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
